version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: wasteiq-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wasteiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wasteiq_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wasteiq}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasteiq-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: wasteiq-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasteiq-network

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wasteiq-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wasteiq}:${POSTGRES_PASSWORD:-wasteiq_pass}@db:5432/${POSTGRES_DB:-wasteiq}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wasteiq-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  wasteiq-network:
    driver: bridge